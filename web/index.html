<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta
      name="description"
      content="Ledgerly brings personal, family, and team money into one clear workspace."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f5f2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <script>
      try {
        const storedPreference = JSON.parse(
          localStorage.getItem('mt-theme') || '"system"',
        )
        const storedTheme =
          storedPreference === 'light' ||
          storedPreference === 'dark' ||
          storedPreference === 'system'
            ? storedPreference
            : 'system'
        const resolvedTheme =
          storedTheme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : storedTheme
        document.documentElement.dataset.theme = resolvedTheme
        document.documentElement.style.colorScheme = resolvedTheme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', resolvedTheme === 'dark' ? '#0b120e' : '#f1f5f2')
      } catch {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.style.colorScheme = 'light'
      }
    </script>
    <title>Ledgerly | money clarity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
