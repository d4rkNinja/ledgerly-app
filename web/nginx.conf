server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep uploads aligned with MAX_BODY_BYTES on the API (default 1 MiB,
    # hard cap 16 MiB); raise both together when importing large statements.
    client_max_body_size 17m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # ^~ keeps hashed-asset and SPA rules from shadowing the API proxy.
    location ^~ /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
